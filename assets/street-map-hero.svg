<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mohamed Wael Jouini — SIG 3D Empilement de Couches Animées (Layered GIS Architecture)">
  <defs>
    <!-- Cyberpunk Deep Blue Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02050e"/>
      <stop offset="35%" stop-color="#060c1d"/>
      <stop offset="75%" stop-color="#09142b"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <linearGradient id="layerGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="layerGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="layerGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowPurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Moving Vehicle & Data Pod Symbols -->
    <g id="carEast">
      <polygon points="0,0 8,-3 8,3" fill="#38bdf8" opacity="0.8"/>
      <circle r="2.8" fill="#ffffff" filter="url(#glowCyan)"/>
      <circle r="1.5" cx="-3" cy="0" fill="#ef4444"/>
    </g>
    <g id="carWest">
      <polygon points="0,0 -8,-3 -8,3" fill="#38bdf8" opacity="0.8"/>
      <circle r="2.8" fill="#ffffff" filter="url(#glowCyan)"/>
      <circle r="1.5" cx="3" cy="0" fill="#ef4444"/>
    </g>
    <g id="monorailPod">
      <rect x="-12" y="-3" width="24" height="6" rx="3" fill="#10b981" filter="url(#glowGreen)"/>
      <circle cx="-6" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="6" cy="0" r="1.5" fill="#ffffff"/>
    </g>
    <g id="vrdDataPulse">
      <circle r="3" fill="#c084fc" filter="url(#glowPurple)"/>
      <circle r="6" fill="#c084fc" opacity="0.4"/>
    </g>

    <clipPath id="mapClip"><rect width="1200" height="430" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#mapClip)">
    <!-- Canvas Background -->
    <rect width="1200" height="430" fill="url(#bgGrad)"/>

    <!-- ==================== 3D EXPLODED LAYER STACK VIEWPORT ==================== -->
    <g transform="translate(380, 205) rotate(-25) skewX(35) scale(0.72, 0.50)">

      <!-- VERTICAL CONNECTOR GUIDE LINES LINKING ALL 3 LAYERS -->
      <g stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.45">
        <line x1="-300" y1="-200" x2="-300" y2="160"/>
        <line x1="300" y1="-200" x2="300" y2="160"/>
        <line x1="-300" y1="100" x2="-300" y2="460"/>
        <line x1="300" y1="100" x2="300" y2="460"/>
        <line x1="0" y1="-100" x2="0" y2="260"/>
      </g>

      <!-- ========================================================================= -->
      <!-- COUCHE 1 (BASSE, Z=-1) : VRD & RÉSEAUX SOUTERRAINS (EAU, FIBRE, GAZ)     -->
      <!-- ========================================================================= -->
      <g transform="translate(0, 160)">
        <!-- Layer 1 Plane Base -->
        <polygon points="-350,-220 350,-220 350,180 -350,180" fill="url(#layerGrad1)" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.6"/>
        
        <!-- Grid Sub-surface -->
        <path d="M -350,-120 L 350,-120 M -350,-20 L 350,-20 M -350,80 L 350,80" stroke="#0f172a" stroke-width="6"/>
        <path d="M -200,-220 L -200,180 M 0,-220 L 0,180 M 200,-220 L 200,180" stroke="#0f172a" stroke-width="6"/>

        <!-- VRD Network Lines -->
        <!-- AEP / EU Water Pipe (Cyan) -->
        <path id="vrdPipeAEP" d="M -340,-120 L 340,-120" stroke="#0284c7" stroke-width="3" stroke-dasharray="10,5" fill="none"/>
        <path d="M -200,-210 L -200,170" stroke="#0284c7" stroke-width="3" stroke-dasharray="10,5" fill="none"/>
        
        <!-- Fibre Optique FTTH (Purple) -->
        <path id="vrdPipeFibre" d="M -340,-20 L 340,-20" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="8,4" fill="none"/>
        <path d="M 0,-210 L 0,170" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="8,4" fill="none"/>

        <!-- Gaz & Chaleur Urbaine (Orange) -->
        <path d="M -340,80 L 340,80" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4" fill="none"/>

        <!-- Regards de visite / Manholes -->
        <g fill="#0f172a" stroke="#38bdf8" stroke-width="1.5">
          <circle cx="-200" cy="-120" r="5"/><circle cx="-200" cy="-120" r="2" fill="#38bdf8"/>
          <circle cx="0" cy="-120" r="5"/><circle cx="0" cy="-120" r="2" fill="#38bdf8"/>
          <circle cx="200" cy="-120" r="5"/><circle cx="200" cy="-120" r="2" fill="#38bdf8"/>
          <circle cx="0" cy="-20" r="5"/><circle cx="0" cy="-20" r="2" fill="#c084fc"/>
        </g>

        <!-- Animated Data Pulse on Fiber -->
        <g>
          <use href="#vrdDataPulse"><animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#vrdPipeFibre"/></animateMotion></use>
        </g>

        <!-- Layer Label 1 -->
        <g transform="translate(-340, -200)">
          <rect x="0" y="0" width="220" height="22" rx="4" fill="#0369a1" opacity="0.85"/>
          <text x="10" y="15" fill="#ffffff" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold">COUCHE 1 : RÉSEAUX VRD (Z=-1)</text>
        </g>
      </g>

      <!-- ========================================================================= -->
      <!-- COUCHE 2 (MILIEU, Z=0) : CADASTRE, VOIRIE & BÂTIMENTS 3D                 -->
      <!-- ========================================================================= -->
      <g transform="translate(0, 0)">
        <!-- Layer 2 Plane Base -->
        <polygon points="-350,-220 350,-220 350,180 -350,180" fill="url(#layerGrad2)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>

        <!-- Street Network -->
        <g stroke="#1e293b" stroke-width="14" fill="none">
          <path id="c2Street1" d="M -340,-100 L 340,-100"/>
          <path id="c2Street2" d="M -340,40 L 340,40"/>
          <path id="c2Street3" d="M -150,-210 L -150,170"/>
          <path id="c2Street4" d="M 150,-210 L 150,170"/>
        </g>
        <g stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6">
          <line x1="-340" y1="-100" x2="340" y2="-100"/>
          <line x1="-340" y1="40" x2="340" y2="40"/>
          <line x1="-150" y1="-210" x2="-150" y2="170"/>
          <line x1="150" y1="-210" x2="150" y2="170"/>
        </g>

        <!-- 3D Cadastral Buildings -->
        <g stroke="#334155" stroke-width="0.6">
          <!-- Building 1 -->
          <g transform="translate(-250, -180)">
            <polygon points="0,0 50,0 50,40 0,40" fill="#0f172a"/>
            <polygon points="0,0 50,0 50,-20 0,-20" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
            <polygon points="50,0 50,40 50,20 50,-20" fill="#0b1324"/>
          </g>
          <!-- Building 2 -->
          <g transform="translate(40, -180)">
            <polygon points="0,0 60,0 60,45 0,45" fill="#0f172a"/>
            <polygon points="0,0 60,0 60,-25 0,-25" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
            <polygon points="60,0 60,45 60,20 60,-25" fill="#0b1324"/>
          </g>
          <!-- Building 3 -->
          <g transform="translate(-80, -30)">
            <polygon points="0,0 70,0 70,50 0,50" fill="#0f172a"/>
            <polygon points="0,0 70,0 70,-30 0,-30" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
            <polygon points="70,0 70,50 70,20 70,-30" fill="#0b1324"/>
          </g>
          <!-- Building 4 -->
          <g transform="translate(200, -30)">
            <polygon points="0,0 55,0 55,40 0,40" fill="#0f172a"/>
            <polygon points="0,0 55,0 55,-20 0,-20" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
            <polygon points="55,0 55,40 55,20 55,-20" fill="#0b1324"/>
          </g>
        </g>

        <!-- Animated Street Traffic (Layer 2 Animation) -->
        <g>
          <use href="#carEast"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#c2Street1"/></animateMotion></use>
          <use href="#carWest"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite" rotate="auto"><mpath href="#c2Street2"/></animateMotion></use>
        </g>

        <!-- Layer Label 2 -->
        <g transform="translate(-340, -200)">
          <rect x="0" y="0" width="240" height="22" rx="4" fill="#0284c7" opacity="0.85"/>
          <text x="10" y="15" fill="#ffffff" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold">COUCHE 2 : CADASTRE &amp; BÂTI 3D (Z=0)</text>
        </g>
      </g>

      <!-- ========================================================================= -->
      <!-- COUCHE 3 (HAUTE, Z=+1) : INFRASTRUCTURES AÉRIENNES & MOBILITÉ          -->
      <!-- ========================================================================= -->
      <g transform="translate(0, -160)">
        <!-- Layer 3 Plane Base -->
        <polygon points="-350,-220 350,-220 350,180 -350,180" fill="url(#layerGrad3)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>

        <!-- High-Voltage Grid & Pylons -->
        <g transform="translate(-180, -80)">
          <line x1="0" y1="0" x2="0" y2="-40" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="-10" y1="-25" x2="10" y2="-25" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="0" cy="-40" r="2.5" fill="#ffffff" filter="url(#glowCyan)"/>
        </g>
        <g transform="translate(180, -80)">
          <line x1="0" y1="0" x2="0" y2="-40" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="-10" y1="-25" x2="10" y2="-25" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="0" cy="-40" r="2.5" fill="#ffffff" filter="url(#glowCyan)"/>
        </g>
        <path d="M -180,-120 Q 0,-105 180,-120" fill="none" stroke="#38bdf8" stroke-width="1.2" filter="url(#glowCyan)"/>

        <!-- Elevated Viaduct Track (Monorail Layer 3) -->
        <path id="c3Viaduct" d="M -340,30 L 340,30" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glowGreen)"/>
        <path d="M -340,30 L 340,30" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="6,4"/>

        <!-- Central Telecom Antenna -->
        <g transform="translate(0, -60)">
          <line x1="0" y1="0" x2="0" y2="-50" stroke="#c084fc" stroke-width="2" filter="url(#glowPurple)"/>
          <circle cx="0" cy="-50" r="3.5" fill="#ffffff"/>
          <circle cx="0" cy="0" r="25" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.6">
            <animate attributeName="r" values="5;40;5" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- Animated High-Speed Monorail Pod (Layer 3 Animation) -->
        <g>
          <use href="#monorailPod"><animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto"><mpath href="#c3Viaduct"/></animateMotion></use>
        </g>

        <!-- Layer Label 3 -->
        <g transform="translate(-340, -200)">
          <rect x="0" y="0" width="250" height="22" rx="4" fill="#7e22ce" opacity="0.85"/>
          <text x="10" y="15" fill="#ffffff" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold">COUCHE 3 : AÉRIEN &amp; MOBILITÉ (Z=+1)</text>
        </g>
      </g>

    </g> <!-- End 3D Exploded Layer Stack Viewport -->

    <!-- GIS Spatial Analysis Laser Scanline -->
    <line x1="0" y1="0" x2="0" y2="430" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#glowCyan)">
      <animate attributeName="x1" values="-20;820;-20" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20;820;-20" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- Overlay Technical Annotations & Coordinates -->
    <g font-family="'JetBrains Mono','SF Mono','Fira Code','Courier New',monospace" font-weight="400" font-size="8.5" fill="#64748b" opacity="0.85">
      <text x="20" y="24" fill="#38bdf8" font-weight="600" letter-spacing="1">SIG 3D · EMPILEMENT MULTI-COUCHES ANIMÉES (STACK ARCHITECTURE)</text>
      <text x="20" y="415" letter-spacing="0.8">48°51'24" N  2°21'07" E · EPSG:2154 (RGF93 / LAMBERT-93)</text>
      <text x="780" y="24" letter-spacing="0.8" text-anchor="end">POSTGIS 3D / CITYGML 3.0</text>
    </g>

    <!-- Compass Rose / North Arrow 3D -->
    <g transform="translate(760, 50)" opacity="0.85">
      <circle cx="0" cy="0" r="15" fill="#080e21" stroke="#38bdf8" stroke-width="1"/>
      <polygon points="0,-12 4,0 0,-3 -4,0" fill="#38bdf8"/>
      <polygon points="0,12 4,0 0,3 -4,0" fill="#64748b"/>
      <text x="0" y="-15" fill="#38bdf8" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">N</text>
    </g>

    <!-- Scale Bar 3D -->
    <g transform="translate(670, 405)" stroke="#94a3b8" stroke-width="1" opacity="0.85">
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="30" y1="-2" x2="30" y2="2"/>
      <line x1="60" y1="-3" x2="60" y2="3"/>
      <text x="30" y="-5" fill="#94a3b8" font-family="monospace" font-size="7.5" text-anchor="middle" stroke="none">2 km (3D)</text>
    </g>

    <!-- ==================== RIGHT PANEL: PROFILE IDENTITY CARD ==================== -->
    <rect x="800" y="0" width="400" height="430" fill="#040813" opacity="0.96"/>
    <line x1="800" y1="0" x2="800" y2="430" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Top Neon Accent Bar -->
    <line x1="800" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.9"/>

    <g text-anchor="end">
      <!-- Role Badge -->
      <rect x="940" y="32" width="235" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="952" cy="43" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1165" y="47" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="600" letter-spacing="1.5">RESPONSABLE SIG · FRANCE</text>

      <!-- Main Name -->
      <text x="1175" y="115" fill="#f8fafc" font-size="42" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="600" letter-spacing="0.5">Mohamed Wael Jouini</text>
      
      <!-- Subtitle Divider Line -->
      <line x1="910" y1="135" x2="1175" y2="135" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.2"/>
      <circle cx="910" cy="135" r="2.5" fill="#38bdf8"/>
      <circle cx="1175" cy="135" r="2.5" fill="#38bdf8"/>

      <!-- Expertise Specialties -->
      <text x="1175" y="168" fill="#38bdf8" font-size="16" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="500" font-style="italic">Bases de Données Spatiales · PostGIS &amp; QGIS</text>
      <text x="1175" y="195" fill="#e2e8f0" font-size="15" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="400" opacity="0.9">SIG 3D Multi-Couches (VRD, Bâti &amp; Aérien)</text>
      <text x="1175" y="220" fill="#e2e8f0" font-size="15" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="400" opacity="0.9">Workflows FME Form Advanced, Python &amp; SQL</text>

      <!-- Technical Tags / Pills -->
      <g transform="translate(1175, 265)">
        <!-- Tag 1: PostGIS 3D -->
        <rect x="-260" y="0" width="80" height="20" rx="4" fill="#1e3a8a" opacity="0.85"/>
        <text x="-220" y="14" fill="#93c5fd" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">PostGIS 3D</text>

        <!-- Tag 2: QGIS -->
        <rect x="-172" y="0" width="55" height="20" rx="4" fill="#065f46" opacity="0.85"/>
        <text x="-145" y="14" fill="#6ee7b7" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">QGIS</text>

        <!-- Tag 3: VRD & FME -->
        <rect x="-110" y="0" width="70" height="20" rx="4" fill="#7a2882" opacity="0.85"/>
        <text x="-75" y="14" fill="#e9d5ff" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">VRD &amp; FME</text>

        <!-- Tag 4: Python -->
        <rect x="-33" y="0" width="33" height="20" rx="4" fill="#854d0e" opacity="0.85"/>
        <text x="-16" y="14" fill="#fde047" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">Py</text>
      </g>

      <!-- Projects / Footer -->
      <line x1="840" y1="330" x2="1175" y2="330" stroke="#334155" stroke-width="0.8"/>
      
      <text x="1175" y="360" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="400" letter-spacing="1.2">PROJET EXTENSION : GeoBan France (QGIS Official Plugin)</text>
      <text x="1175" y="382" fill="#64748b" font-size="9" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="400" letter-spacing="1">COMMUNAUTÉ DE COMMUNES DES SABLONS · FRANCE</text>
    </g>

    <!-- Outer Frame Border -->
    <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
