<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mohamed Wael Jouini — Cartographie 3D Empilement de Couches SIG (GIS Layer Sandwich)">
  <defs>
    <!-- Cyberpunk Deep Blue Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02050e"/>
      <stop offset="35%" stop-color="#060c1d"/>
      <stop offset="75%" stop-color="#09142b"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <!-- Translucent Glassmorphism Layer Planes -->
    <linearGradient id="planeGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="planeGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="planeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowPurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Animated Markers -->
    <g id="carEast">
      <polygon points="0,0 8,-3 8,3" fill="#38bdf8" opacity="0.9"/>
      <circle r="2.8" fill="#ffffff" filter="url(#glowCyan)"/>
      <circle r="1.5" cx="-3" cy="0" fill="#ef4444"/>
    </g>
    <g id="carWest">
      <polygon points="0,0 -8,-3 -8,3" fill="#38bdf8" opacity="0.9"/>
      <circle r="2.8" fill="#ffffff" filter="url(#glowCyan)"/>
      <circle r="1.5" cx="3" cy="0" fill="#ef4444"/>
    </g>
    <g id="monorailPod">
      <rect x="-12" y="-3" width="24" height="6" rx="3" fill="#10b981" filter="url(#glowGreen)"/>
      <circle cx="-6" cy="0" r="1.5" fill="#ffffff"/>
      <circle cx="6" cy="0" r="1.5" fill="#ffffff"/>
    </g>
    <g id="vrdPulse">
      <circle r="3" fill="#c084fc" filter="url(#glowPurple)"/>
      <circle r="6.5" fill="#c084fc" opacity="0.35"/>
    </g>

    <clipPath id="mapClip"><rect width="1200" height="430" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#mapClip)">
    <!-- Canvas Background -->
    <rect width="1200" height="430" fill="url(#bgGrad)"/>

    <!-- ==================== 3D PARALLEL LAYER STACK VIEWPORT ==================== -->
    <g transform="translate(380, 215) rotate(-24) skewX(36) scale(0.72, 0.48)">

      <!-- CORNER DROP LINES CONNECTING THE 3 STACKED LAYERS -->
      <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.55">
        <!-- Top-Left Corner -->
        <line x1="-320" y1="-230" x2="-320" y2="170"/>
        <!-- Top-Right Corner -->
        <line x1="320" y1="-230" x2="320" y2="170"/>
        <!-- Bottom-Left Corner -->
        <line x1="-320" y1="-50" x2="-320" y2="350"/>
        <!-- Bottom-Right Corner -->
        <line x1="320" y1="-50" x2="320" y2="350"/>
        <!-- Center Pillar Axis -->
        <line x1="0" y1="-140" x2="0" y2="260"/>
      </g>

      <!-- ========================================================================= -->
      <!-- COUCHE 1 (SOUTERRAIN, Z=-1) : VRD & RÉSEAUX DIVERS (AEP, FIBRE, GAZ)      -->
      <!-- ========================================================================= -->
      <g transform="translate(0, 100)">
        <!-- Layer 1 Translucent Plane -->
        <polygon points="-320,-140 320,-140 320,140 -320,140" fill="url(#planeGrad1)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8"/>

        <!-- VRD Sub-surface Networks -->
        <!-- Assainissement & Eau Potable AEP (Blue) -->
        <path id="l1AEP" d="M -300,-80 L 300,-80" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="12,6" fill="none"/>
        <path d="M -160,-130 L -160,130" stroke="#0284c7" stroke-width="3.5" stroke-dasharray="12,6" fill="none"/>

        <!-- Telecom & Fibre Optique FTTH (Purple) -->
        <path id="l1Fibre" d="M -300,0 L 300,0" stroke="#c084fc" stroke-width="3" stroke-dasharray="10,5" fill="none" filter="url(#glowPurple)"/>
        <path d="M 0,-130 L 0,130" stroke="#c084fc" stroke-width="3" stroke-dasharray="10,5" fill="none"/>

        <!-- Gaz & Chaleur Urbaine (Orange) -->
        <path d="M -300,80 L 300,80" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8,4" fill="none"/>
        <path d="M 160,-130 L 160,130" stroke="#f97316" stroke-width="2.5" stroke-dasharray="8,4" fill="none"/>

        <!-- Regards de Visite VRD / Nodes -->
        <g fill="#0f172a" stroke="#38bdf8" stroke-width="1.5">
          <circle cx="-160" cy="-80" r="5"/><circle cx="-160" cy="-80" r="2" fill="#38bdf8"/>
          <circle cx="0" cy="-80" r="5"/><circle cx="0" cy="-80" r="2" fill="#38bdf8"/>
          <circle cx="160" cy="-80" r="5"/><circle cx="160" cy="-80" r="2" fill="#38bdf8"/>
          <circle cx="0" cy="0" r="5"/><circle cx="0" cy="0" r="2" fill="#c084fc"/>
          <circle cx="160" cy="80" r="5"/><circle cx="160" cy="80" r="2" fill="#f97316"/>
        </g>

        <!-- Animated Data Pulse in Subsurface Fiber -->
        <g>
          <use href="#vrdPulse"><animateMotion dur="3.5s" repeatCount="indefinite" rotate="auto"><mpath href="#l1Fibre"/></animateMotion></use>
        </g>

        <!-- Layer Label 1 -->
        <g transform="translate(-310, -125)">
          <rect x="0" y="0" width="220" height="22" rx="4" fill="#0369a1" opacity="0.9"/>
          <text x="10" y="15" fill="#ffffff" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold">COUCHE 1 : RÉSEAUX VRD (Z=-1)</text>
        </g>
      </g>

      <!-- ========================================================================= -->
      <!-- COUCHE 2 (SURFACE, Z=0) : CADASTRE, VOIRIE & BÂTIMENTS 3D                -->
      <!-- ========================================================================= -->
      <g transform="translate(0, 0)">
        <!-- Layer 2 Translucent Plane -->
        <polygon points="-320,-140 320,-140 320,140 -320,140" fill="url(#planeGrad2)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

        <!-- Cadastral Street Network -->
        <g stroke="#1e293b" stroke-width="14" fill="none">
          <path id="l2Street1" d="M -300,-70 L 300,-70"/>
          <path id="l2Street2" d="M -300,50 L 300,50"/>
          <path id="l2Street3" d="M -140,-130 L -140,130"/>
          <path id="l2Street4" d="M 140,-130 L 140,130"/>
        </g>
        <g stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.6">
          <line x1="-300" y1="-70" x2="300" y2="-70"/>
          <line x1="-300" y1="50" x2="300" y2="50"/>
          <line x1="-140" y1="-130" x2="-140" y2="130"/>
          <line x1="140" y1="-130" x2="140" y2="130"/>
        </g>

        <!-- 3D Isometric Buildings -->
        <g stroke="#334155" stroke-width="0.6">
          <!-- Building A -->
          <g transform="translate(-240, -135)">
            <polygon points="0,0 55,0 55,35 0,35" fill="#0f172a"/>
            <polygon points="0,0 55,0 55,-18 0,-18" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
            <polygon points="55,0 55,35 55,17 55,-18" fill="#0b1324"/>
          </g>
          <!-- Building B -->
          <g transform="translate(30, -135)">
            <polygon points="0,0 65,0 65,40 0,40" fill="#0f172a"/>
            <polygon points="0,0 65,0 65,-22 0,-22" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
            <polygon points="65,0 65,40 65,18 65,-22" fill="#0b1324"/>
          </g>
          <!-- Building C -->
          <g transform="translate(-80, -10)">
            <polygon points="0,0 75,0 75,45 0,45" fill="#0f172a"/>
            <polygon points="0,0 75,0 75,-25 0,-25" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
            <polygon points="75,0 75,45 75,20 75,-25" fill="#0b1324"/>
          </g>
          <!-- Building D -->
          <g transform="translate(190, -10)">
            <polygon points="0,0 50,0 50,35 0,35" fill="#0f172a"/>
            <polygon points="0,0 50,0 50,-18 0,-18" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
            <polygon points="50,0 50,35 50,17 50,-18" fill="#0b1324"/>
          </g>
        </g>

        <!-- Animated Vehicles on Street Grid -->
        <g>
          <use href="#carEast"><animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto"><mpath href="#l2Street1"/></animateMotion></use>
          <use href="#carWest"><animateMotion dur="6.2s" begin="-2s" repeatCount="indefinite" rotate="auto"><mpath href="#l2Street2"/></animateMotion></use>
        </g>

        <!-- Layer Label 2 -->
        <g transform="translate(-310, -125)">
          <rect x="0" y="0" width="240" height="22" rx="4" fill="#0284c7" opacity="0.9"/>
          <text x="10" y="15" fill="#ffffff" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold">COUCHE 2 : CADASTRE &amp; BÂTI 3D (Z=0)</text>
        </g>
      </g>

      <!-- ========================================================================= -->
      <!-- COUCHE 3 (AÉRIEN, Z=+1) : MOBILITÉ, ÉNERGIE & TELECOM                    -->
      <!-- ========================================================================= -->
      <g transform="translate(0, -100)">
        <!-- Layer 3 Translucent Plane -->
        <polygon points="-320,-140 320,-140 320,140 -320,140" fill="url(#planeGrad3)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.8"/>

        <!-- Overhead Electric Grid & Pylons -->
        <g transform="translate(-160, -60)">
          <line x1="0" y1="0" x2="0" y2="-38" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="-10" y1="-24" x2="10" y2="-24" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="0" cy="-38" r="2.5" fill="#ffffff" filter="url(#glowCyan)"/>
        </g>
        <g transform="translate(160, -60)">
          <line x1="0" y1="0" x2="0" y2="-38" stroke="#38bdf8" stroke-width="1.5"/>
          <line x1="-10" y1="-24" x2="10" y2="-24" stroke="#38bdf8" stroke-width="1.2"/>
          <circle cx="0" cy="-38" r="2.5" fill="#ffffff" filter="url(#glowCyan)"/>
        </g>
        <path d="M -160,-98 Q 0,-85 160,-98" fill="none" stroke="#38bdf8" stroke-width="1.2" filter="url(#glowCyan)"/>

        <!-- Elevated Viaduct Track (Monorail Layer 3) -->
        <path id="l3Viaduct" d="M -300,35 L 300,35" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glowGreen)"/>
        <path d="M -300,35 L 300,35" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="6,4"/>

        <!-- Telecom Antenna Spire -->
        <g transform="translate(0, -50)">
          <line x1="0" y1="0" x2="0" y2="-45" stroke="#c084fc" stroke-width="2" filter="url(#glowPurple)"/>
          <circle cx="0" cy="-45" r="3.5" fill="#ffffff"/>
          <circle cx="0" cy="0" r="22" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.6">
            <animate attributeName="r" values="5;35;5" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- Animated High-Speed Monorail Transit Pod -->
        <g>
          <use href="#monorailPod"><animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto"><mpath href="#l3Viaduct"/></animateMotion></use>
        </g>

        <!-- Layer Label 3 -->
        <g transform="translate(-310, -125)">
          <rect x="0" y="0" width="250" height="22" rx="4" fill="#7e22ce" opacity="0.9"/>
          <text x="10" y="15" fill="#ffffff" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold">COUCHE 3 : AÉRIEN &amp; MOBILITÉ (Z=+1)</text>
        </g>
      </g>

    </g> <!-- End 3D Parallel Layer Stack Viewport -->

    <!-- GIS Spatial Analysis Laser Scanline -->
    <line x1="0" y1="0" x2="0" y2="430" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#glowCyan)">
      <animate attributeName="x1" values="-20;820;-20" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20;820;-20" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- Overlay Technical Annotations & Coordinates -->
    <g font-family="'JetBrains Mono','SF Mono','Fira Code','Courier New',monospace" font-weight="400" font-size="8.5" fill="#64748b" opacity="0.85">
      <text x="20" y="24" fill="#38bdf8" font-weight="600" letter-spacing="1">SIG 3D · EMPILEMENT DE COUCHES SUPERPOSÉES ANIMÉES</text>
      <text x="20" y="415" letter-spacing="0.8">48°51'24" N  2°21'07" E · EPSG:2154 (RGF93 / LAMBERT-93)</text>
      <text x="780" y="24" letter-spacing="0.8" text-anchor="end">POSTGIS 3D / CITYGML 3.0</text>
    </g>

    <!-- Compass Rose / North Arrow 3D -->
    <g transform="translate(760, 50)" opacity="0.85">
      <circle cx="0" cy="0" r="15" fill="#080e21" stroke="#38bdf8" stroke-width="1"/>
      <polygon points="0,-12 4,0 0,-3 -4,0" fill="#38bdf8"/>
      <polygon points="0,12 4,0 0,3 -4,0" fill="#64748b"/>
      <text x="0" y="-15" fill="#38bdf8" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">N</text>
    </g>

    <!-- Scale Bar 3D -->
    <g transform="translate(670, 405)" stroke="#94a3b8" stroke-width="1" opacity="0.85">
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="30" y1="-2" x2="30" y2="2"/>
      <line x1="60" y1="-3" x2="60" y2="3"/>
      <text x="30" y="-5" fill="#94a3b8" font-family="monospace" font-size="7.5" text-anchor="middle" stroke="none">2 km (3D)</text>
    </g>

    <!-- ==================== RIGHT PANEL: PROFILE IDENTITY CARD ==================== -->
    <rect x="800" y="0" width="400" height="430" fill="#040813" opacity="0.96"/>
    <line x1="800" y1="0" x2="800" y2="430" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Top Neon Accent Bar -->
    <line x1="800" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.9"/>

    <g text-anchor="end">
      <!-- Role Badge -->
      <rect x="940" y="32" width="235" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="952" cy="43" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1165" y="47" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="600" letter-spacing="1.5">RESPONSABLE SIG · FRANCE</text>

      <!-- Main Name -->
      <text x="1175" y="115" fill="#f8fafc" font-size="42" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="600" letter-spacing="0.5">Mohamed Wael Jouini</text>
      
      <!-- Subtitle Divider Line -->
      <line x1="910" y1="135" x2="1175" y2="135" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.2"/>
      <circle cx="910" cy="135" r="2.5" fill="#38bdf8"/>
      <circle cx="1175" cy="135" r="2.5" fill="#38bdf8"/>

      <!-- Expertise Specialties -->
      <text x="1175" y="168" fill="#38bdf8" font-size="16" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="500" font-style="italic">Bases de Données Spatiales · PostGIS &amp; QGIS</text>
      <text x="1175" y="195" fill="#e2e8f0" font-size="15" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="400" opacity="0.9">SIG 3D Multi-Couches (VRD, Bâti &amp; Aérien)</text>
      <text x="1175" y="220" fill="#e2e8f0" font-size="15" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="400" opacity="0.9">Workflows FME Form Advanced, Python &amp; SQL</text>

      <!-- Technical Tags / Pills -->
      <g transform="translate(1175, 265)">
        <!-- Tag 1: PostGIS 3D -->
        <rect x="-260" y="0" width="80" height="20" rx="4" fill="#1e3a8a" opacity="0.85"/>
        <text x="-220" y="14" fill="#93c5fd" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">PostGIS 3D</text>

        <!-- Tag 2: QGIS -->
        <rect x="-172" y="0" width="55" height="20" rx="4" fill="#065f46" opacity="0.85"/>
        <text x="-145" y="14" fill="#6ee7b7" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">QGIS</text>

        <!-- Tag 3: VRD & FME -->
        <rect x="-110" y="0" width="70" height="20" rx="4" fill="#7a2882" opacity="0.85"/>
        <text x="-75" y="14" fill="#e9d5ff" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">VRD &amp; FME</text>

        <!-- Tag 4: Python -->
        <rect x="-33" y="0" width="33" height="20" rx="4" fill="#854d0e" opacity="0.85"/>
        <text x="-16" y="14" fill="#fde047" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">Py</text>
      </g>

      <!-- Projects / Footer -->
      <line x1="840" y1="330" x2="1175" y2="330" stroke="#334155" stroke-width="0.8"/>
      
      <text x="1175" y="360" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="400" letter-spacing="1.2">PROJET EXTENSION : GeoBan France (QGIS Official Plugin)</text>
      <text x="1175" y="382" fill="#64748b" font-size="9" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="400" letter-spacing="1">COMMUNAUTÉ DE COMMUNES DES SABLONS · FRANCE</text>
    </g>

    <!-- Outer Frame Border -->
    <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
