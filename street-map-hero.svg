<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mohamed Wael Jouini — Cartographie 3D Empilement de Couches SIG Espacées (Exploded GIS Slabs Stack)">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02050e"/>
      <stop offset="35%" stop-color="#060c1d"/>
      <stop offset="75%" stop-color="#09142b"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <!-- Slab Top Face Gradients (Glassmorphism White & Colors) -->
    <linearGradient id="slabTop5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="slabTop4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="slabTop3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="slabTop2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#166534" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="slabTop1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Symbols -->
    <g id="carEast">
      <polygon points="0,0 7,-2.5 7,2.5" fill="#0284c7"/>
      <circle r="2" fill="#ffffff"/>
    </g>
    <g id="carWest">
      <polygon points="0,0 -7,-2.5 -7,2.5" fill="#0284c7"/>
      <circle r="2" fill="#ffffff"/>
    </g>

    <clipPath id="mapClip"><rect width="1200" height="430" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#mapClip)">
    <!-- Background -->
    <rect width="1200" height="430" fill="url(#bgGrad)"/>

    <!-- ==================== 3D EXPLODED GIS SLAB STACK WITH GENEROSITY SPACING ==================== -->
    <g transform="translate(370, 215) rotate(-26) skewX(34) scale(0.62, 0.38)">

      <!-- VERTICAL CORNER GUIDE LINES CONNECTING ALL 5 SLABS -->
      <g stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.4">
        <!-- Top-Left Axis -->
        <line x1="-300" y1="-310" x2="-300" y2="310"/>
        <!-- Top-Right Axis -->
        <line x1="300" y1="-310" x2="300" y2="310"/>
      </g>

      <!-- SLAB 1 (BOTTOM, Y = +190) : GRILLE DE RÉFÉRENCE SIG & VRD -->
      <g transform="translate(0, 190)">
        <!-- Slab Thickness Side -->
        <polygon points="-300,-120 300,-120 300,-104 -300,-104" fill="#020617" stroke="#334155" stroke-width="1"/>
        <polygon points="300,-120 300,120 300,136 300,-104" fill="#090d16" stroke="#334155" stroke-width="1"/>
        <polygon points="-300,120 300,120 300,136 -300,136" fill="#020617" stroke="#334155" stroke-width="1"/>

        <!-- Slab Top Face -->
        <polygon points="-300,-120 300,-120 300,120 -300,120" fill="url(#slabTop1)" stroke="#475569" stroke-width="2"/>

        <!-- Black & White Checkerboard Grid Pattern on Layer 1 -->
        <g stroke="#334155" stroke-width="1.2" fill="none">
          <line x1="-300" y1="-80" x2="300" y2="-80"/>
          <line x1="-300" y1="-40" x2="300" y2="-40"/>
          <line x1="-300" y1="0" x2="300" y2="0"/>
          <line x1="-300" y1="40" x2="300" y2="40"/>
          <line x1="-300" y1="80" x2="300" y2="80"/>

          <line x1="-200" y1="-120" x2="-200" y2="120"/>
          <line x1="-100" y1="-120" x2="-100" y2="120"/>
          <line x1="0" y1="-120" x2="0" y2="120"/>
          <line x1="100" y1="-120" x2="100" y2="120"/>
          <line x1="200" y1="-120" x2="200" y2="120"/>
        </g>

        <!-- Subterranean VRD Networks (Cyan & Purple Pipes) -->
        <path d="M -280,-40 L 280,-40" stroke="#0284c7" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
        <path d="M -100,-110 L -100,110" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6,3" fill="none"/>
        <circle cx="-100" cy="-40" r="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      </g>

      <!-- SLAB 2 (Y = +95) : ORTHOPHOTOGRAPHIE & OCCUPATION DU SOL -->
      <g transform="translate(0, 95)">
        <!-- Slab Thickness Side -->
        <polygon points="-300,-120 300,-120 300,-104 -300,-104" fill="#052e16" stroke="#15803d" stroke-width="1"/>
        <polygon points="300,-120 300,120 300,136 300,-104" fill="#022c22" stroke="#15803d" stroke-width="1"/>
        <polygon points="-300,120 300,120 300,136 -300,136" fill="#052e16" stroke="#15803d" stroke-width="1"/>

        <!-- Slab Top Face -->
        <polygon points="-300,-120 300,-120 300,120 -300,120" fill="url(#slabTop2)" stroke="#22c55e" stroke-width="1.5"/>

        <!-- Agricultural Fields & Forest Parcels Texture -->
        <g stroke="#15803d" stroke-width="1" fill="none">
          <path d="M -300,-60 L -100,-60 L -100,120 M -100,20 L 300,20 M 100,-120 L 100,20" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6,3"/>
          <path d="M -250,-120 C -200,-50 -180,30 -220,120" stroke="#0284c7" stroke-width="4" fill="none"/>
          <polygon points="-80,-100 80,-100 50,-20 -50,-20" fill="#14532d" opacity="0.6"/>
          <polygon points="120,40 280,40 250,100 140,100" fill="#166534" opacity="0.7"/>
        </g>
      </g>

      <!-- SLAB 3 (MIDDLE, Y = 0) : TOPOGRAPHIE & RELIEF (MNT / COURBES DE NIVEAU) -->
      <g transform="translate(0, 0)">
        <!-- Slab Thickness Side -->
        <polygon points="-300,-120 300,-120 300,-104 -300,-104" fill="#64748b" opacity="0.5"/>
        <polygon points="300,-120 300,120 300,136 300,-104" fill="#475569" opacity="0.5"/>
        <polygon points="-300,120 300,120 300,136 -300,136" fill="#64748b" opacity="0.5"/>

        <!-- Slab Top Face -->
        <polygon points="-300,-120 300,-120 300,120 -300,120" fill="url(#slabTop3)" stroke="#cbd5e1" stroke-width="1.5"/>

        <!-- Topographical Contour Lines -->
        <g stroke="#64748b" stroke-width="1.2" fill="none" opacity="0.85">
          <path d="M -260,-80 C -180,-110 -100,-90 -40,-60 C 20,-30 100,-50 180,-80 C 240,-100 280,-70 290,-40"/>
          <path d="M -280,-40 C -200,-70 -120,-50 -60,-20 C 0,10 80,-10 160,-40 C 220,-60 270,-30 285,0"/>
          <path d="M -290,0 C -220,-30 -140,-10 -80,20 C -20,50 60,30 140,0 C 200,-20 250,10 275,40"/>
          <path d="M -295,40 C -230,10 -160,30 -100,60 C -40,90 40,70 120,40 C 180,20 230,50 260,80"/>
          <text x="-50" y="-62" font-family="monospace" font-size="7" fill="#475569">140m</text>
          <text x="130" y="-42" font-family="monospace" font-size="7" fill="#475569">150m</text>
        </g>
      </g>

      <!-- SLAB 4 (Y = -95) : CADASTRE & MESURES VECTORIELLES (30.2m, 15.1m) -->
      <g transform="translate(0, -95)">
        <!-- Slab Thickness Side -->
        <polygon points="-300,-120 300,-120 300,-104 -300,-104" fill="#94a3b8" opacity="0.5"/>
        <polygon points="300,-120 300,120 300,136 300,-104" fill="#64748b" opacity="0.5"/>
        <polygon points="-300,120 300,120 300,136 -300,136" fill="#94a3b8" opacity="0.5"/>

        <!-- Slab Top Face -->
        <polygon points="-300,-120 300,-120 300,120 -300,120" fill="url(#slabTop4)" stroke="#94a3b8" stroke-width="1.5"/>

        <!-- Road Grid -->
        <g stroke="#334155" stroke-width="2" fill="none">
          <path id="s4Road1" d="M -280,-60 L 280,-60"/>
          <path id="s4Road2" d="M -280,50 L 280,50"/>
          <path d="M -120,-110 L -120,110"/>
          <path d="M 120,-110 L 120,110"/>
        </g>

        <!-- Red Dimension Measurement Arrows -->
        <g stroke="#ef4444" stroke-width="1.8" fill="none" filter="url(#glowRed)">
          <line x1="-80" y1="-10" x2="80" y2="-10"/>
          <polyline points="-74,-14 -80,-10 -74,-6"/>
          <polyline points="74,-14 80,-10 74,-6"/>

          <line x1="30" y1="-35" x2="110" y2="-35"/>
          <polyline points="36,-39 30,-35 36,-31"/>
          <polyline points="104,-39 110,-35 104,-31"/>
        </g>

        <!-- Dimension Labels -->
        <text x="0" y="-14" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">30.2m</text>
        <text x="70" y="-39" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="bold" fill="#ef4444" text-anchor="middle">15.1m</text>

        <!-- Moving Traffic -->
        <use href="#carEast"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#s4Road1"/></animateMotion></use>
      </g>

      <!-- SLAB 5 (TOP, Y = -190) : HYDROGRAPHIE & ÉQUIPEMENTS (GeoBan / BAN) -->
      <g transform="translate(0, -190)">
        <!-- Slab Thickness Side -->
        <polygon points="-300,-120 300,-120 300,-104 -300,-104" fill="#cbd5e1" opacity="0.6"/>
        <polygon points="300,-120 300,120 300,136 300,-104" fill="#94a3b8" opacity="0.6"/>
        <polygon points="-300,120 300,120 300,136 -300,136" fill="#cbd5e1" opacity="0.6"/>

        <!-- Slab Top Face -->
        <polygon points="-300,-120 300,-120 300,120 -300,120" fill="url(#slabTop5)" stroke="#38bdf8" stroke-width="2"/>

        <!-- Organic Hydrography Water Pool Polygon -->
        <path d="M -90,-20 C -60,-60 40,-70 90,-40 C 130,-15 110,40 50,50 C -20,60 -120,40 -90,-20 Z" 
              fill="#7dd3fc" fill-opacity="0.6" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6,3"/>

        <!-- Location Pin Marker / GeoBan Equipment Pin -->
        <g transform="translate(-10, -15)">
          <path d="M 0,-18 C -5,-18 -9,-14 -9,-9 C -9,-2 0,6 0,6 C 0,6 9,-2 9,-9 C 9,-14 5,-18 0,-18 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
          <circle cx="0" cy="-9" r="3" fill="#ffffff"/>
        </g>
        <text x="5" y="-15" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="bold" fill="#0369a1">Équipement BAN</text>
      </g>

    </g> <!-- End 3D Exploded Layer Stack Viewport -->

    <!-- GIS Spatial Scanline Laser -->
    <line x1="0" y1="0" x2="0" y2="430" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#glowCyan)">
      <animate attributeName="x1" values="-20;820;-20" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-20;820;-20" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- Overlay Technical Annotations -->
    <g font-family="'JetBrains Mono','SF Mono','Fira Code','Courier New',monospace" font-weight="400" font-size="8.5" fill="#64748b" opacity="0.85">
      <text x="20" y="24" fill="#38bdf8" font-weight="600" letter-spacing="1">SIG 3D · EMPILEMENT DE COUCHES VECTORIELLES &amp; MNT (GIS STACK)</text>
      <text x="20" y="415" letter-spacing="0.8">48°51'24" N  2°21'07" E · EPSG:2154 (RGF93 / LAMBERT-93)</text>
      <text x="780" y="24" letter-spacing="0.8" text-anchor="end">POSTGIS 3D / CITYGML 3.0</text>
    </g>

    <!-- Compass Rose / North Arrow 3D -->
    <g transform="translate(760, 50)" opacity="0.85">
      <circle cx="0" cy="0" r="15" fill="#080e21" stroke="#38bdf8" stroke-width="1"/>
      <polygon points="0,-12 4,0 0,-3 -4,0" fill="#38bdf8"/>
      <polygon points="0,12 4,0 0,3 -4,0" fill="#64748b"/>
      <text x="0" y="-15" fill="#38bdf8" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">N</text>
    </g>

    <!-- Scale Bar 3D -->
    <g transform="translate(670, 405)" stroke="#94a3b8" stroke-width="1" opacity="0.85">
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="30" y1="-2" x2="30" y2="2"/>
      <line x1="60" y1="-3" x2="60" y2="3"/>
      <text x="30" y="-5" fill="#94a3b8" font-family="monospace" font-size="7.5" text-anchor="middle" stroke="none">2 km (3D)</text>
    </g>

    <!-- ==================== RIGHT PANEL: PROFILE IDENTITY CARD ==================== -->
    <rect x="800" y="0" width="400" height="430" fill="#040813" opacity="0.96"/>
    <line x1="800" y1="0" x2="800" y2="430" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- Top Neon Accent Bar -->
    <line x1="800" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.9"/>

    <g text-anchor="end">
      <!-- Role Badge -->
      <rect x="940" y="32" width="235" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="952" cy="43" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="1165" y="47" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="600" letter-spacing="1.5">RESPONSABLE SIG · FRANCE</text>

      <!-- Main Name -->
      <text x="1175" y="115" fill="#f8fafc" font-size="42" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="600" letter-spacing="0.5">Mohamed Wael Jouini</text>
      
      <!-- Subtitle Divider Line -->
      <line x1="910" y1="135" x2="1175" y2="135" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.2"/>
      <circle cx="910" cy="135" r="2.5" fill="#38bdf8"/>
      <circle cx="1175" cy="135" r="2.5" fill="#38bdf8"/>

      <!-- Expertise Specialties -->
      <text x="1175" y="168" fill="#38bdf8" font-size="16" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="500" font-style="italic">Bases de Données Spatiales · PostGIS &amp; QGIS</text>
      <text x="1175" y="195" fill="#e2e8f0" font-size="15" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="400" opacity="0.9">SIG 3D Multi-Couches (VRD, MNT &amp; Cadastre)</text>
      <text x="1175" y="220" fill="#e2e8f0" font-size="15" font-family="'Cormorant Garamond','EB Garamond','Georgia',serif" font-weight="400" opacity="0.9">Workflows FME Form Advanced, Python &amp; SQL</text>

      <!-- Technical Tags / Pills -->
      <g transform="translate(1175, 265)">
        <!-- Tag 1: PostGIS 3D -->
        <rect x="-260" y="0" width="80" height="20" rx="4" fill="#1e3a8a" opacity="0.85"/>
        <text x="-220" y="14" fill="#93c5fd" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">PostGIS 3D</text>

        <!-- Tag 2: QGIS -->
        <rect x="-172" y="0" width="55" height="20" rx="4" fill="#065f46" opacity="0.85"/>
        <text x="-145" y="14" fill="#6ee7b7" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">QGIS</text>

        <!-- Tag 3: VRD & FME -->
        <rect x="-110" y="0" width="70" height="20" rx="4" fill="#7a2882" opacity="0.85"/>
        <text x="-75" y="14" fill="#e9d5ff" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">VRD &amp; FME</text>

        <!-- Tag 4: Python -->
        <rect x="-33" y="0" width="33" height="20" rx="4" fill="#854d0e" opacity="0.85"/>
        <text x="-16" y="14" fill="#fde047" font-size="9.5" font-family="monospace" text-anchor="middle" font-weight="bold">Py</text>
      </g>

      <!-- Projects / Footer -->
      <line x1="840" y1="330" x2="1175" y2="330" stroke="#334155" stroke-width="0.8"/>
      
      <text x="1175" y="360" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="400" letter-spacing="1.2">PROJET EXTENSION : GeoBan France (QGIS Official Plugin)</text>
      <text x="1175" y="382" fill="#64748b" font-size="9" font-family="'JetBrains Mono','Fira Code',monospace" font-weight="400" letter-spacing="1">COMMUNAUTÉ DE COMMUNES DES SABLONS · FRANCE</text>
    </g>

    <!-- Outer Frame Border -->
    <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
